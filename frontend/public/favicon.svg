<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!--
      gradientUnits="userSpaceOnUse" con coordenadas absolutas del bounding box
      de cada anillo → ambas mitades del anillo comparten la misma gradiente
      y parecen un anillo continuo aunque se dibujen en dos trazados separados.
    -->

    <!-- Anillo izquierdo: cx=24, cy=40, r=13 → bbox (11,27)→(37,53) -->
    <linearGradient id="gL" x1="11" y1="27" x2="37" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#F8E196"/>
      <stop offset="48%"  stop-color="#CF9520"/>
      <stop offset="100%" stop-color="#7A4A0E"/>
    </linearGradient>

    <!-- Anillo derecho: cx=40, cy=40, r=13 → bbox (27,27)→(53,53) -->
    <linearGradient id="gR" x1="27" y1="27" x2="53" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#F8E196"/>
      <stop offset="48%"  stop-color="#CF9520"/>
      <stop offset="100%" stop-color="#7A4A0E"/>
    </linearGradient>

    <!-- Diamante: de blanco puro a azul hielo -->
    <linearGradient id="gD" x1="17" y1="13" x2="31" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="65%"  stop-color="#C8E4F4"/>
      <stop offset="100%" stop-color="#8EC0DF"/>
    </linearGradient>
  </defs>

  <!--
    ══════════════════════════════════════════════════
    TÉCNICA DE ENTRELAZADO LIMPIO (sin sombras):
      El anillo IZQUIERDO pasa POR DELANTE en la parte superior.
      El anillo DERECHO  pasa POR DELANTE en la parte inferior.

    Orden de pintado:
      [1] Mitad INFERIOR del anillo izquierdo  → queda DETRÁS del derecho abajo
      [2] Anillo DERECHO completo
      [3] Mitad SUPERIOR del anillo izquierdo  → tapa al derecho arriba
    ══════════════════════════════════════════════════

    Anillo izquierdo (cx=24, cy=40, r=13):
      Punto izquierdo: (11, 40)  Punto derecho: (37, 40)
      · Mitad inferior (sweep=1, sentido horario → baja por (24,53)):
          M 11 40 A 13 13 0 0 1 37 40
      · Mitad superior (sweep=0, antihorario → sube por (24,27)):
          M 11 40 A 13 13 0 0 0 37 40

    Anillo derecho (cx=40, cy=40, r=13):
      circle cx=40 cy=40 r=13  (dibujado completo)
  -->

  <!-- [1] Mitad inferior del anillo izquierdo (por detrás) -->
  <path d="M 11 40 A 13 13 0 0 1 37 40"
        stroke="url(#gL)" stroke-width="5" stroke-linecap="butt" fill="none"/>

  <!-- [2] Anillo derecho completo -->
  <circle cx="40" cy="40" r="13"
          stroke="url(#gR)" stroke-width="5" fill="none"/>

  <!-- [3] Mitad superior del anillo izquierdo (por delante, tapa el cruce) -->
  <path d="M 11 40 A 13 13 0 0 0 37 40"
        stroke="url(#gL)" stroke-width="5" stroke-linecap="butt" fill="none"/>

  <!--
    ══════════════════════════════════════════════════
    DIAMANTE SOLITARIO
    Forma de cometa (brillante en perfil):
      Punta superior : (24, 13)
      Cintura (girdle): (17, 20) y (31, 20)
      Base (engaste) : (24, 27)  ← toca el tope del anillo izquierdo
    ══════════════════════════════════════════════════
  -->
  <polygon points="24,13 31,20 24,27 17,20"
           fill="url(#gD)" stroke="#A8D4EE" stroke-width="0.6"/>

  <!-- Líneas de facetas del diamante -->
  <!-- Cintura horizontal -->
  <line x1="17" y1="20" x2="31" y2="20"
        stroke="#FFFFFF" stroke-width="0.75" opacity="0.9"/>
  <!-- Eje vertical central -->
  <line x1="24" y1="13" x2="24" y2="27"
        stroke="#FFFFFF" stroke-width="0.6" opacity="0.85"/>
  <!-- Facetas de la corona (izquierda y derecha) -->
  <line x1="17" y1="20" x2="21.5" y2="15.5"
        stroke="#FFFFFF" stroke-width="0.4" opacity="0.55"/>
  <line x1="31" y1="20" x2="26.5" y2="15.5"
        stroke="#FFFFFF" stroke-width="0.4" opacity="0.55"/>
  <!-- Sombra sutil en pabellón inferior-derecho (da volumen sin filtros) -->
  <polygon points="31,20 24,27 27,24"
           fill="#4A90C0" opacity="0.18"/>

  <!--
    ══════════════════════════════════════════════════
    DESTELLO (sparkle de 4 puntas)
    Estrella de cuatro puntas que emana de la punta del diamante (24,13).
    Punta superior: (24, 7)   Punta inferior: (24, 14) [se funde con el diamante]
    Punta derecha : (27.5,13) Punta izquierda: (20.5,13)
    ══════════════════════════════════════════════════
  -->
  <path d="M24,7 Q24.5,10.5 27.5,13 Q24.5,10.5 24,14 Q23.5,10.5 20.5,13 Q23.5,10.5 24,7 Z"
        fill="#FFFFFF"/>
  <!-- Rayos diagonales sutiles a 45° (más cortos) -->
  <path d="M21.8,9.8 Q24,11.2 26.2,9.8 Q24,11.2 26.2,12.5 Q24,11.2 21.8,12.5 Q24,11.2 21.8,9.8 Z"
        fill="#FFFFFF" opacity="0.4"/>
  <!-- Punto central del destello -->
  <circle cx="24" cy="11" r="0.9" fill="#FFFFFF"/>
</svg>