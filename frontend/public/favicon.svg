<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6"/>
      <stop offset="35%" stop-color="#E2BA72"/>
      <stop offset="70%" stop-color="#C59642"/>
      <stop offset="100%" stop-color="#8F621D"/>
    </linearGradient>
    <linearGradient id="gold2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#F0D08E"/>
      <stop offset="70%" stop-color="#D4A44C"/>
      <stop offset="100%" stop-color="#7D5114"/>
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#BBDEFB"/>
    </linearGradient>
    <filter id="gemGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Anillo Izquierdo (Base) -->
  <circle cx="26" cy="36" r="16" stroke="url(#gold1)" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Anillo Derecho -->
  <circle cx="38" cy="36" r="16" stroke="url(#gold2)" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Arco de entrelazado para dar efecto de profundidad 3D -->
  <path d="M 32 21.2 A 16 16 0 0 1 42 22.8" stroke="url(#gold2)" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Gema de Diamante sobre el anillo izquierdo -->
  <polygon points="26,10 32.5,17.5 26,23 19.5,17.5" fill="url(#gemGrad)" stroke="#FFFFFF" stroke-width="0.8" filter="url(#gemGlow)"/>
  
  <!-- Facetas del Diamante -->
  <polyline points="19.5,17.5 26,15 32.5,17.5" stroke="#FFFFFF" stroke-width="0.6" fill="none" opacity="0.8"/>
  <line x1="26" y1="10" x2="26" y2="23" stroke="#FFFFFF" stroke-width="0.7" opacity="0.9"/>

  <!-- Destello Principal Brillante (Sparkle) -->
  <path d="M 26,4 Q 26,10 20,10 Q 26,10 26,16 Q 26,10 32,10 Q 26,10 26,4 Z" fill="#FFFFFF"/>
  <circle cx="26" cy="10" r="1.3" fill="#FFFFFF"/>

  <!-- Destello Secundario Sutil -->
  <path d="M 45,21 Q 45,23.5 42.5,23.5 Q 45,23.5 45,26 Q 45,23.5 47.5,23.5 Q 45,23.5 45,21 Z" fill="#FFFFFF" opacity="0.9"/>
</svg>