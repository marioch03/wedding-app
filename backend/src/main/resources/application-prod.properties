# ==============================================================================
# Wedding App - Perfil de Producción (application-prod.properties)
# ==============================================================================

# Ocultación de Información Sensible y Trazas
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Base de Datos PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de Conexiones HikariCP
spring.datasource.hikari.pool-name=HikariCP-WeddingApp-Prod
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1200000}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Migraciones Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Endurecimiento de Spring Boot Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoints.web.base-path=/actuator

# Autenticación JWT con Clerk (Resource Server)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${CLERK_ISSUER_URI}

# Política de CORS Estricta
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Almacenamiento de Archivos Multimedia
app.upload.dir=${APP_UPLOAD_DIR:/app/uploads/images}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Rate Limiting en Memoria
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.rsvp.limit-per-minute=${RATE_LIMIT_RSVP_RPM:30}
app.rate-limit.media.limit-per-minute=${RATE_LIMIT_MEDIA_RPM:40}

# Monitorización de Errores y APM (Sentry)
sentry.dsn=${SENTRY_DSN:}
sentry.environment=production
sentry.traces-sample-rate=0.2
sentry.logs.enabled=true
sentry.send-default-pii=false
sentry.exception-resolver-order=-2147483648

