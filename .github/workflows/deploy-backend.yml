name: Deploy Backend to AWS EC2

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'docker-compose.yaml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend (EC2)
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          timeout: 120s
          command_timeout: 15m
          script: |
            set -e
            echo "🚀 Iniciando despliegue de Backend en AWS EC2..."

            cd ~/wedding-app

            echo "📥 Descargando últimos cambios de main..."
            git checkout main
            git pull origin main

            echo "🔨 Reconstruyendo contenedor backend..."
            docker compose build backend

            echo "🔄 Levantando contenedor backend..."
            docker compose up -d backend

            echo "🧹 Limpiando imágenes intermedias huérfanas..."
            docker image prune -f

            echo "🩺 Esperando a que el backend esté listo (Healthcheck)..."
            HEALTH_PORT=$(grep '^BACKEND_PORT=' .env 2>/dev/null | cut -d '=' -f2 || true)
            HEALTH_PORT=${HEALTH_PORT:-80}

            for i in {1..30}; do
              if curl -s "http://127.0.0.1:${HEALTH_PORT}/actuator/health" | grep -q '"status":"UP"'; then
                echo "✅ Backend desplegado y saludable en el puerto ${HEALTH_PORT}!"
                exit 0
              fi
              echo "Esperando arranque... ($i/30)"
              sleep 3
            done

            echo "❌ Error: El backend no superó el health check tras 90 segundos."
            docker compose logs --tail=50 backend
            exit 1
